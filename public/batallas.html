<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batallas — SkinDrop</title>
    <meta name="description" content="Batallas de cajas de SkinDrop contra bots o contra otros jugadores: 1v1, 2v2 y más modos. Gana el mejor total y se lleva los objetos virtuales.">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/battles.css">
    <link rel="stylesheet" href="css/lobbies.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body data-page="batallas">
    <div id="siteHeader"></div>

    <main class="main-content">
        <!-- Case battles: against bots (js/battles.js) or against other players (js/lobbies.js) -->
        <section class="battles-section" id="battles">
            <div class="section-header">
                <h2><i class="fas fa-crosshairs"></i> BATALLAS DE CAJAS</h2>
            </div>
            <div class="battles-modes" role="tablist" aria-label="Tipo de batalla">
                <button type="button" class="battles-mode-btn is-active" role="tab" id="tabBots" aria-selected="true" aria-controls="battlesRoot" data-battles-tab="bots">
                    <i class="fas fa-robot"></i> Contra bots
                </button>
                <button type="button" class="battles-mode-btn" role="tab" id="tabPlayers" aria-selected="false" aria-controls="lobbiesRoot" data-battles-tab="players">
                    <i class="fas fa-users"></i> Contra jugadores
                </button>
            </div>
            <div class="battles-root" id="battlesRoot" role="tabpanel" aria-labelledby="tabBots"></div>
            <div class="battles-root" id="lobbiesRoot" role="tabpanel" aria-labelledby="tabPlayers" hidden></div>
        </section>
    </main>

    <div id="siteFooter"></div>

    <script src="js/layout.js"></script>
    <script src="js/sfx.js"></script>
    <script src="js/data.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/case-art.js"></script>
    <script src="js/app.js"></script>
    <script src="js/battles.js"></script>
    <script src="js/lobbies.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
